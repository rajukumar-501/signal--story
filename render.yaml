services:
  - type: web
    name: signal-story-portal
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: HOST
        value: 0.0.0.0
      - key: LLM_PROVIDER
        value: mock
      - key: GEMINI_API_KEY
        sync: false
